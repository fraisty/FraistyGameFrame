syntax = "proto3";
package frframe.network.v1;
option csharp_namespace = "FRFrame.Network.Protocol.Wire";

// The surrounding FRFrame envelope supplies the OpCode and RequestId.
// The shared control DTO is validated against its request shape at the application boundary.
message SliceWire {
  reserved 1, 17;
  reserved "request_id";
  uint32 error = 2;
  uint32 reply_to = 3;
  int32 room = 4;
  int32 player = 5;
  int32 session = 6;
  string text = 7;
  uint32 stream = 8;
  uint32 generation = 9;
  int32 header = 10;
  int32 schema = 11;
  fixed64 hash = 12;
  int32 marker = 13;
  repeated int32 member_ids = 14;
  int32 online = 15;
  int32 capacity = 16;
  int32 epoch = 18;
  int32 connection_generation = 19;
  string token = 20;
  int32 target = 21;
  int32 delay_ms = 22;
  optional uint32 game_message_id = 23;
  optional bytes game_payload = 24;
  optional uint32 business_message_id = 25;
  optional bytes business_payload = 26;
}

message ProfileRequest {
  uint32 version = 1;
  uint32 increment = 2;
}
message ProfileSnapshot {
  uint32 version = 1;
  int32 player_id = 2;
  uint32 count = 3;
}

message CounterAdd {
  uint32 version = 1;
  sint32 amount = 2;
}

message CounterChanged {
  uint32 version = 1;
  uint32 value = 2;
}
